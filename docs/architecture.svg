<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" role="img" aria-label="宠物陪伴 Agent 系统结构图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F47B52"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9B5A4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="760" fill="#FFF8F0"/>

  <text x="60" y="54" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#4A3F38">宠物陪伴 Agent · 系统结构</text>
  <text x="60" y="82" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#8A7A6D">Docker Compose 编排四类存储，API 与 Worker 独立进程运行</text>

  <!-- ===== 客户端 ===== -->
  <rect x="210" y="104" width="320" height="86" rx="12" fill="#FFFFFF" stroke="#EADDD0" stroke-width="1.2"/>
  <text x="370" y="134" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#4A3F38">微信小程序</text>
  <text x="370" y="157" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B5C51">首页 · 聊天 · 记忆 · 选择/创建</text>
  <text x="370" y="177" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#A29284">分片回调接收流式回复</text>

  <rect x="570" y="104" width="320" height="86" rx="12" fill="#FFFFFF" stroke="#EADDD0" stroke-width="1.2"/>
  <text x="730" y="134" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#4A3F38">H5 调试台</text>
  <text x="730" y="157" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B5C51">浏览器里跑同一套后端链路</text>
  <text x="730" y="177" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#A29284">开发期验证 / 浏览器端调试</text>

  <line x1="550" y1="190" x2="550" y2="218" stroke="#F47B52" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="562" y="209" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#F47B52">HTTPS / SSE</text>

  <!-- ===== API ===== -->
  <rect x="340" y="222" width="420" height="100" rx="12" fill="#FFF3EC" stroke="#F47B52" stroke-width="1.4"/>
  <text x="550" y="252" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#4A3F38">API 进程（FastAPI）</text>
  <text x="550" y="277" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B5C51">受理 Run · 推进事件流 · 限流与取消</text>
  <text x="550" y="299" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#A29284">SSE：Last-Event-ID 断点续传</text>

  <line x1="550" y1="322" x2="550" y2="348" stroke="#F47B52" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="562" y="341" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#F47B52">任务入队（Mongo 队列）</text>

  <!-- ===== 队列 ===== -->
  <rect x="370" y="352" width="360" height="66" rx="12" fill="#FFFFFF" stroke="#EADDD0" stroke-width="1.2"/>
  <text x="550" y="377" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#4A3F38">任务队列（MongoDB）</text>
  <text x="550" y="399" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8A7A6D">lease · 心跳续租 · fencing token</text>

  <line x1="550" y1="418" x2="550" y2="446" stroke="#F47B52" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="562" y="437" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#F47B52">领取 / 完成 / 失败</text>

  <!-- ===== Worker ===== -->
  <rect x="340" y="450" width="420" height="96" rx="12" fill="#FFF3EC" stroke="#F47B52" stroke-width="1.4"/>
  <text x="550" y="479" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#4A3F38">Worker 进程</text>
  <text x="550" y="503" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B5C51">记忆抽取 · 三判定消解 · 索引投影</text>
  <text x="550" y="524" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#A29284">崩了会被回收重试；旧 Worker 提交不了（幂等 + fencing）</text>

  <!-- 存储总线 -->
  <line x1="550" y1="546" x2="550" y2="558" stroke="#C9B5A4" stroke-width="1.6" marker-end="url(#arrowSoft)"/>
  <line x1="209" y1="558" x2="911" y2="558" stroke="#C9B5A4" stroke-width="1.6"/>
  <line x1="209" y1="558" x2="209" y2="572" stroke="#C9B5A4" stroke-width="1.6" marker-end="url(#arrowSoft)"/>
  <line x1="443" y1="558" x2="443" y2="572" stroke="#C9B5A4" stroke-width="1.6" marker-end="url(#arrowSoft)"/>
  <line x1="677" y1="558" x2="677" y2="572" stroke="#C9B5A4" stroke-width="1.6" marker-end="url(#arrowSoft)"/>
  <line x1="911" y1="558" x2="911" y2="572" stroke="#C9B5A4" stroke-width="1.6" marker-end="url(#arrowSoft)"/>
  <text x="76" y="553" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#B7A79A">端口-适配器</text>

  <!-- ===== 存储 ===== -->
  <rect x="104" y="576" width="210" height="84" rx="12" fill="#FFFFFF" stroke="#EADDD0" stroke-width="1.2"/>
  <text x="209" y="604" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#4A3F38">MySQL 8</text>
  <text x="209" y="626" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8A7A6D">账号 · 宠物档案</text>
  <text x="209" y="645" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#B7A79A">唯一约束 / 事务</text>

  <rect x="338" y="576" width="210" height="84" rx="12" fill="#FFFFFF" stroke="#F47B52" stroke-width="1.2"/>
  <text x="443" y="604" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#4A3F38">MongoDB 7</text>
  <text x="443" y="626" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8A7A6D">消息 · 记忆 · 出处 · 队列</text>
  <text x="443" y="645" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#F47B52">权威数据（不可再生）</text>

  <rect x="572" y="576" width="210" height="84" rx="12" fill="#FFFFFF" stroke="#F47B52" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="677" y="604" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#4A3F38">Qdrant</text>
  <text x="677" y="626" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8A7A6D">向量索引</text>
  <text x="677" y="645" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#F47B52">投影（可重建）</text>

  <rect x="806" y="576" width="210" height="84" rx="12" fill="#FFFFFF" stroke="#EADDD0" stroke-width="1.2"/>
  <text x="911" y="604" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#4A3F38">Redis 7</text>
  <text x="911" y="626" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8A7A6D">限流计数 · 短租约</text>
  <text x="911" y="645" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#B7A79A">不放不可再生数据</text>

  <!-- ===== 百炼 ===== -->
  <rect x="880" y="222" width="200" height="324" rx="12" fill="#FFFFFF" stroke="#C9B5A4" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="980" y="252" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#4A3F38">阿里云百炼</text>
  <text x="980" y="272" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#B7A79A">外部模型服务</text>
  <text x="980" y="312" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6B5C51">对话</text>
  <text x="980" y="330" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#A29284">deepseek-v4-flash</text>
  <text x="980" y="364" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6B5C51">向量（1024 维）</text>
  <text x="980" y="382" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#A29284">text-embedding-v3</text>
  <text x="980" y="416" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6B5C51">宠物立绘 / 表情</text>
  <text x="980" y="434" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#A29284">qwen-image-2.0（离线）</text>
  <text x="980" y="468" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6B5C51">召回排序</text>
  <text x="980" y="486" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#A29284">RRF + 多信号（应用内）</text>
  <text x="980" y="510" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10" fill="#B7A79A">模型路由由配置驱动</text>

  <line x1="760" y1="272" x2="874" y2="272" stroke="#C9B5A4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowSoft)"/>
  <line x1="760" y1="498" x2="874" y2="498" stroke="#C9B5A4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowSoft)"/>

  <!-- ===== 脚注 ===== -->
  <line x1="60" y1="686" x2="1060" y2="686" stroke="#EADDD0" stroke-width="1"/>
  <text x="60" y="710" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#8A7A6D">权威数据 = 不可再生的原文、Memory 与出处；投影 = 可由 Memory 重建的向量索引。删一条记忆必须同时删两处，否则要么搜得到已删除内容，要么重建索引后它又回来。</text>
  <text x="60" y="732" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#8A7A6D">模型调用、存储访问都是端口-适配器里的适配器：业务层只认 domain/ports.py 的 Protocol，换实现不动业务代码。</text>
</svg>